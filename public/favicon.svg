<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="community-sharepoint-title">
    <title id="community-sharepoint-title">Community Sharepoint</title>
    <defs>
        <linearGradient id="community-sharepoint-bg" x1="0" y1="0" x2="0.4" y2="1">
            <stop offset="0" stop-color="#3b82f6"/>
            <stop offset="1" stop-color="#1d4ed8"/>
        </linearGradient>
        <mask id="community-sharepoint-mark">
            <rect width="64" height="64" fill="#000000"/>
            <!-- House: the neighbourhood -->
            <path d="M32 7 59 29H50V55H14V29H5Z" fill="#ffffff"/>
            <!-- Share glyph: items passed between neighbours -->
            <g fill="#000000" stroke="#000000">
                <path d="M23 28 41 37M23 46 41 37" fill="none" stroke-width="4" stroke-linecap="round"/>
                <circle cx="23" cy="28" r="4.3"/>
                <circle cx="23" cy="46" r="4.3"/>
                <circle cx="41" cy="37" r="4.3"/>
            </g>
        </mask>
    </defs>

    <rect width="64" height="64" rx="14" fill="url(#community-sharepoint-bg)"/>
    <rect width="64" height="64" rx="14" fill="#ffffff" mask="url(#community-sharepoint-mark)"/>
</svg>
