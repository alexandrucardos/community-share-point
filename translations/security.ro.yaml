# Authentication errors shown by error.messageKey|trans(..., 'security') in the
# auth templates. Symfony ships the standard security messages for ro itself;
# these are the ones this app throws from OtpLoginAuthenticator.
"Your login code has expired, please request a new one.": "Codul tău de autentificare a expirat, te rugăm să ceri unul nou."
"That login code is not valid or has expired.": "Acest cod de autentificare nu este valid sau a expirat."
