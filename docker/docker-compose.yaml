name: "community-share-point"

services:
  comm-nginx:
    restart: always
    build:
      context: ./../
      dockerfile: docker/nginx/Dockerfile
      args:
        ENVIRONMENT: docker-sql
    container_name: comm-nginx
    environment:
      COUNTRY_CODE: ro
      ENVIRONMENT: dev
    volumes:
      - type: bind
        source: ./../public
        target: /var/www/comm/public
    networks:
      - proxy
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.comm.entrypoints=web'
      - "traefik.http.routers.comm.rule=Host(`comm.localhost`)"
      - 'traefik.docker-sql.network=proxy'
      - 'traefik.http.services.comm.loadbalancer.server.port=80'
    depends_on:
      - comm-php

  comm-php:
    restart: always
    build:
      context: ./../
      dockerfile: docker/php-fpm/Dockerfile
      args:
        ENVIRONMENT: docker-sql
    container_name: comm-phpfpm
    volumes:
      - "~/.gitconfig:/etc/gitconfig"
      - "~/.aws/credentials:/root/.aws/credentials"
      - type: bind
        source: ./../
        target: /var/www/comm
    environment:
      ENVIRONMENT: docker-sql
      COUNTRY_CODE: ro
      APP_ENV: dev
    networks:
      - proxy

networks:
  proxy:
    external: true
