security:
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            id: App\Service\Security\AppUserProvider

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Service\Security\OtpLoginAuthenticator
            entry_point: App\Service\Security\OtpLoginAuthenticator

            # No target: App\Service\Security\LogoutRedirectSubscriber redirects
            # to /group/{uuid}/login using the logged-out user's group.
            logout:
                path: app_logout

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER
        ROLE_USER: ROLE_GUEST

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/group/[^/]+/register, roles: PUBLIC_ACCESS }
        - { path: ^/group/[^/]+/login, roles: PUBLIC_ACCESS }
        - { path: ^/group/[^/]+/account, roles: ROLE_USER }
        - { path: ^/group/[^/]+/items/group, roles: PUBLIC_ACCESS }
        - { path: ^/group/[^/]+/items, roles: ROLE_USER }
        - { path: ^/group/[^/]+/request-log, roles: ROLE_ADMIN }

