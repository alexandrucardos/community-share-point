security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        App\Service\Security\SecurityUser: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            id: App\Service\Security\AppUserProvider

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider

            custom_authenticator: App\Service\Security\LoginFormAuthenticator

            entry_point: App\Service\Security\LoginFormAuthenticator

            # No target: App\Service\Security\LogoutRedirectSubscriber redirects
            # to /group/{uuid}/login using the logged-out user's group.
            logout:
                path: app_logout

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/group/[^/]+/register, roles: PUBLIC_ACCESS }
        - { path: ^/group/[^/]+/login, roles: PUBLIC_ACCESS }
        - { path: ^/group/[^/]+/account, roles: ROLE_USER }
        - { path: ^/group/[^/]+/items, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            App\Service\Security\SecurityUser:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
